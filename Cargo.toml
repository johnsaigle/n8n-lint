[package]
name = "n8n-lint"
version = "0.1.0"
edition = "2024"
description = "Opinionated linter for n8n workflow JSON files"

[[bin]]
name = "n8n-lint"
path = "src/main.rs"

[lib]
name = "n8n_lint"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# --- scaffold ---
[profile.dev]
overflow-checks = true
lto = "fat"

[profile.release]
overflow-checks = true
lto = "fat"
opt-level = 3
strip = "debuginfo"
incremental = true

[lints.clippy]
complexity = "warn"
correctness = "warn"
nursery = "warn"
pedantic = "warn"
perf = "warn"
suspicious = "warn"
